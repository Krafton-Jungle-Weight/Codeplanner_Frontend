apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  # 타입을 NodePort로 지정합니다.
  type: NodePort
  selector:
    app: my-frontend
  ports:
    - protocol: TCP
      # 서비스가 내부적으로 사용할 포트입니다.
      port: 3000
      # 컨테이너(Next.js)가 사용하는 포트입니다.
      targetPort: 3000
      # EC2 외부에서 접속할 포트 번호입니다.
      nodePort: 30986